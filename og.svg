<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1f9a"/>
      <stop offset="1" stop-color="#16103f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="2"/>
    </pattern>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#9b6bff"/><rect width="14" height="28" fill="#8455f0"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g fill="none" stroke-width="5" stroke-linecap="round" opacity=".35">
    <path d="M70 80l10 24 26 3-20 17 6 26-22-13-22 13 6-26-20-17 26-3z" stroke="#ffd23f"/>
    <path d="M1060 520c14-36 28-36 34 0s20 36 34 0" stroke="#3ddcff"/>
    <circle cx="1110" cy="90" r="28" stroke="#5ce39a"/>
  </g>

  <!-- title -->
  <g font-family="Arial Rounded MT Bold, Arial Black, sans-serif" font-weight="700" text-anchor="middle" stroke="#160f33" stroke-width="14" paint-order="stroke" stroke-linejoin="round">
    <text x="420" y="150" font-size="112" fill="#ffd23f" transform="rotate(-4 420 150)">Draw</text>
    <text x="720" y="160" font-size="112" fill="#3ddcff" transform="rotate(3 720 160)">That</text>
    <text x="600" y="282" font-size="120" fill="#ff5c8a" transform="rotate(-2 600 282)">Character!</text>
  </g>

  <!-- drawing card -->
  <g transform="translate(170 318) rotate(-5) scale(.88)">
    <rect x="12" y="12" width="260" height="260" rx="26" fill="#160f33"/>
    <rect width="260" height="260" rx="26" fill="#fff" stroke="#160f33" stroke-width="8"/>
    <g fill="none" stroke="#160f33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 96 L66 50 L110 80"/><path d="M186 96 L198 50 L154 80"/>
      <path d="M132 70c46 0 78 32 78 76s-34 78-78 78-78-34-78-78 32-76 78-76z" fill="#3ddcff"/>
      <circle cx="106" cy="140" r="15" fill="#fff"/><circle cx="160" cy="140" r="15" fill="#fff"/>
      <path d="M112 182q20 16 40 0"/>
    </g>
    <circle cx="109" cy="143" r="6" fill="#160f33"/><circle cx="163" cy="143" r="6" fill="#160f33"/>
  </g>

  <!-- VS -->
  <text x="600" y="490" font-family="Arial Rounded MT Bold, Arial Black, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="#ffd23f" stroke="#160f33" stroke-width="10" paint-order="stroke">VS</text>

  <!-- mystery card -->
  <g transform="translate(800 318) rotate(5) scale(.88)">
    <rect x="12" y="12" width="260" height="260" rx="26" fill="#160f33"/>
    <rect width="260" height="260" rx="26" fill="url(#stripes)" stroke="#160f33" stroke-width="8"/>
    <text x="130" y="185" font-family="Arial Rounded MT Bold, Arial Black, sans-serif" font-size="160" font-weight="700" text-anchor="middle" fill="#ffd23f" stroke="#160f33" stroke-width="10" paint-order="stroke">?</text>
  </g>

  <!-- badges -->
  <g transform="translate(600 380)">
    <rect x="-118" y="-34" width="236" height="68" rx="34" fill="#160f33"/>
    <rect x="-124" y="-40" width="236" height="68" rx="34" fill="#5ce39a" stroke="#160f33" stroke-width="6"/>
    <text x="-6" y="7" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#160f33">⏱ 60 sec</text>
  </g>
  <g transform="translate(600 610)">
    <text font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#fff8ec">No peeking. How close can you get?</text>
  </g>
</svg>
